spring:
  application:
    name: pictureframe-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pictureframe}
    username: ${DB_USERNAME:pictureframe}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

server:
  port: 8080

app:
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}

  storage:
    location: ${IMAGE_STORAGE_PATH:./storage/images}
